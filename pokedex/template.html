<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunlit Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Single warm "handheld menu" theme: cream paper, brown ink, tomato red, sunny yellow */
:root{
  color-scheme:light;
  --ground:#FCEFD6; --surface:#FFFBF0; --sunk:#F6E3BF; --raise:#FFF6E2; --ink:#4A2E1E; --muted:#8A6A52; --line:#4A2E1E; --soft-line:#E4C9A0;
  --accent:#E4513B; --accent-ink:#FFFBF0; --accent-soft:#FFD9C9; --gold:#D98E00; --gold-soft:#FFE89A; --focus:#2F7BD9;
  --sky:#8FD3F0; --grass:#7CC85A; --sun:#FFD23F;
  --display:"Silkscreen","Galmuri11","DotGothic16",monospace;
  --body:"Galmuri11","DotGothic16","Malgun Gothic",monospace;
  --mono:"Galmuri11","DotGothic16",monospace;
  --spriteBg:radial-gradient(ellipse 46% 12% at 50% 84%, rgba(74,46,30,.18) 0 98%, transparent 100%), linear-gradient(#DFF3FB 0 60%, #CDEBB2 60% 100%);
  --px:3px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.dexmark{width:22px;height:22px;border-radius:50%;background:linear-gradient(var(--accent) 0 44%, var(--ink) 44% 56%, var(--surface) 56%);border:2px solid var(--ink);position:relative;flex:none}
.dexmark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.search{flex:1;min-width:0;position:relative;max-width:560px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--raise);flex:none}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.iconbtn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 10px;display:none}

/* layout */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1600px;margin:0 auto;min-height:calc(100% - 60px)}
aside.side{border-right:1px solid var(--line);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;height:calc(100vh - 58px);overflow:auto}
.side h3{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.side h3:first-child{margin-top:0}
.coll{display:grid;gap:2px}
.coll button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:8px}
.coll button:hover{background:var(--sunk)}
.coll button[aria-current="true"]{background:var(--ink);color:var(--ground)}
.coll .count{margin-left:auto;font:12px var(--mono);opacity:.7}
.newlist{display:flex;gap:6px;margin-top:6px}
.newlist input{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.newlist button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:6px 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:3px 9px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tchip{display:inline-flex;align-items:center;gap:5px}
.tchip i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
select.sel{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.clear{margin-top:14px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:0}

main{min-width:0;padding:16px}
.summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.summary h1{font:800 26px/1.1 var(--display);letter-spacing:-.02em;margin:0}
.summary .n{font:13px var(--mono);color:var(--muted)}
.summary .sort{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
.summary .sort select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.listtools{display:flex;gap:8px}
.listtools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px}
.listtools button.danger{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:148px 210px;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--muted)}
.card[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.spr{aspect-ratio:1;width:100%;max-width:100%;border-radius:9px;background:var(--spriteBg);position:relative;overflow:hidden}
.spr i{position:absolute;inset:0;background-repeat:no-repeat}
.card .no{font:12px var(--mono);color:var(--muted);margin-top:6px}
.card .nm{font-weight:700;line-height:1.25;margin-top:1px;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--muted);line-height:1.25}
.card .types{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.type{display:inline-block;font:600 11px/1 var(--body);padding:4px 7px;border-radius:5px;background:var(--tc);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap}
.star{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);z-index:2}
.star svg{width:16px;height:16px}
.star[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.badges{position:absolute;left:12px;top:12px;display:flex;gap:3px;z-index:2}
.badge{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--ink);color:var(--ground);letter-spacing:.03em}
.abil .ab{cursor:help}
.abil .ab:hover,.abil .ab:focus-visible{background:var(--sun)}
.tip{position:fixed;z-index:70;max-width:min(280px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:var(--px,3px) solid var(--line);box-shadow:4px 4px 0 var(--line);padding:8px 10px;font:13px/1.5 var(--body);pointer-events:none}
.tip b{display:block;font-family:var(--display);color:var(--accent);font-size:12px;margin-bottom:2px}
.homebtn{font:700 13px/1 var(--display);color:var(--ink);background:var(--surface);border:var(--px) solid var(--line);box-shadow:2px 2px 0 var(--line);padding:8px 10px;text-decoration:none;flex:none}
.homebtn:hover{background:var(--sun)}
@media (max-width:640px){.homebtn .ht{display:none}}
.nospr::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:700 42px/1 var(--display);color:var(--soft-line,#ccc)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* detail */
.detail{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;overflow:auto;box-shadow:-18px 0 40px rgba(10,20,30,.12);overscroll-behavior:contain}
.d-head{display:grid;grid-template-columns:220px 1fr;gap:18px;padding:18px 20px;border-bottom:1px solid var(--line);position:relative}
.d-spr{aspect-ratio:1;border-radius:14px;background:var(--spriteBg);position:relative;overflow:hidden}
.d-spr i{position:absolute;inset:0;background-repeat:no-repeat}
.close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--raise);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
.d-no{font:13px var(--mono);color:var(--muted)}
.d-name{font:800 30px/1.05 var(--display);letter-spacing:-.02em;margin:4px 0 2px;text-wrap:balance}
.d-alt{color:var(--muted);font-size:14px}
.d-types{display:flex;gap:6px;margin:10px 0}
.d-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn svg{width:15px;height:15px}
.shinytog[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.forms{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.forms button{border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:4px 9px;font-size:12.5px}
.forms button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.listmenu{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;margin-top:8px;display:grid;gap:4px;max-width:320px}
.listmenu label{display:flex;gap:8px;align-items:center;padding:3px 4px}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.d-body{padding:18px 20px 60px;display:grid;gap:22px}
.d-body h4{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.dex{margin:0;font-size:14.5px;max-width:62ch}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{background:var(--surface);padding:9px 11px}
.kv b{display:block;font:600 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.kv span{font-variant-numeric:tabular-nums}
.stats{display:grid;gap:5px}
.stat{display:grid;grid-template-columns:70px 36px 1fr;gap:8px;align-items:center;font-size:13px}
.stat .v{font:600 13px var(--mono);text-align:right}
.stat .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.stat .track i{display:block;height:100%;border-radius:99px}
.abil{display:flex;flex-wrap:wrap;gap:6px}
.abil span{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:13px}
.abil span.h{border-style:dashed}
.abil small{color:var(--muted);margin-left:4px}

.spawn{border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:7px;background:var(--raise)}
.spawn-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rar{font:600 11px/1 var(--mono);padding:4px 7px;border-radius:5px;letter-spacing:.03em;text-transform:uppercase}
.rar.common{background:#DDEFE3;color:#1D6B3A}.rar.uncommon{background:#DDE8F7;color:#1F4F9A}.rar.rare{background:#EEE0F7;color:#6A2A9A}.rar.ultra-rare{background:#F9E0DE;color:#9C2A20}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--surface);white-space:nowrap}
.biomes{display:flex;flex-wrap:wrap;gap:5px}
details.bt{display:inline-block}
details.bt summary{list-style:none;cursor:pointer;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px}
details.bt summary::-webkit-details-marker{display:none}
details.bt[open] summary{background:var(--ink);color:var(--ground)}
details.bt .bl{font-size:12px;color:var(--muted);padding:6px 2px 2px;max-width:520px}
.notes{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.raid{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--raise)}
.tier{font:700 13px var(--mono);white-space:nowrap}
.tier i{color:var(--gold);font-style:normal;letter-spacing:-1px}
.evo{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.evo-stage{display:grid;gap:6px;align-content:center}
.evo-mon{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:5px 9px 5px 5px;background:var(--raise);text-align:left;min-width:0}
.evo-mon[aria-current="true"]{border-color:var(--accent)}
.evo-mon .spr{border-radius:7px}
.evo-mon b{display:block;font-size:13px}
.evo-mon small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block}
.evo-arrow{color:var(--muted);font:600 16px var(--mono)}
.evo-tree{display:grid;gap:8px}
.evo-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.evo-cond{font-size:12.5px;border-left:2px solid var(--accent);padding:3px 0 3px 10px}
.partners{display:flex;flex-wrap:wrap;gap:5px}
.partners button{border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:3px 8px;font-size:12.5px}
.oddsrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.odds{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raise)}
.odds b{display:block;font:800 20px/1.1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.odds span{font-size:12px;color:var(--muted)}
.shinycmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px}
.shinycmp figure{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.shinycmp .spr{border-radius:10px;margin-bottom:4px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.formgrid button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:6px;text-align:left}
.formgrid b{display:block;font-size:12.5px;margin-top:4px}
.note{border-left:3px solid var(--gold);background:var(--raise);padding:9px 12px;border-radius:6px;font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:35}
a{color:var(--focus)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;bottom:0;width:min(300px,86vw);height:auto;background:var(--surface);z-index:38;transform:translateX(-102%);transition:transform .2s}
  aside.side.open{transform:none;box-shadow:18px 0 40px rgba(10,20,30,.18)}
  .iconbtn{display:inline-block}
}
@media (max-width:640px){
  .brand .t{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
  .card .sub{display:none}
  .d-head{grid-template-columns:1fr;padding:14px 16px}
  .d-spr{max-width:220px;width:100%;margin:0 auto}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .evo-row{grid-template-columns:1fr}
  .d-body{padding:16px 16px 60px}
  .raid{grid-template-columns:1fr}
  .summary .sort{margin-left:0}
}
@media (prefers-reduced-motion:reduce){aside.side{transition:none}}

/* ---------- game skin overrides ---------- */
body{font-size:14px;line-height:1.6;background:var(--ground);background-image:radial-gradient(rgba(74,46,30,.07) 1px,transparent 1.2px);background-size:12px 12px;-webkit-font-smoothing:none}
.bar{background:var(--accent);border-bottom:var(--px) solid var(--line);box-shadow:0 var(--px) 0 #B8392A}
.brand{color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:17px;text-shadow:2px 2px 0 #B8392A}
.dexmark{border-radius:0;box-shadow:2px 2px 0 var(--line)}
.search input{border:var(--px) solid var(--line);border-radius:0;background:var(--surface);box-shadow:inset 3px 3px 0 var(--sunk)}
.seg{border:var(--px) solid var(--line);border-radius:0;background:var(--surface);padding:2px}
.seg button{border-radius:0;font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.iconbtn{border:var(--px) solid var(--line);border-radius:0;background:var(--surface)}
aside.side{border-right:var(--px) solid var(--line);background:var(--raise)}
.side h3,.d-body h4{font-family:var(--display);font-size:11px;color:var(--accent);letter-spacing:.06em}
.side h3::before,.d-body h4::before{content:"▶ ";color:var(--ink)}
.coll button{border-radius:0;border:2px solid transparent}
.coll button:hover{background:var(--sunk);border-color:var(--soft-line)}
.coll button[aria-current="true"]{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line)}
.coll button[aria-current="true"]::before{content:"▶";color:var(--accent);margin-right:-2px}
.newlist input,.newlist button,select.sel,.summary .sort select{border:2px solid var(--line);border-radius:0;background:var(--surface)}
.newlist button,.btn,.listtools button,.forms button,.partners button,.chip,details.bt summary,.pill,.abil span{border-radius:0}
.chip{border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--line);transform:translate(2px,2px);box-shadow:none}
.clear{color:var(--accent);font-family:var(--display)}
.summary h1{font-family:var(--display);font-size:22px;color:var(--ink);text-shadow:2px 2px 0 var(--sun)}
.card{border:var(--px) solid var(--line);border-radius:0;background:var(--surface);box-shadow:4px 4px 0 var(--line);transition:transform .08s steps(2),box-shadow .08s steps(2)}
.card:hover{border-color:var(--line);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.card[aria-selected="true"]{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
.spr{border-radius:0;border:2px solid var(--soft-line)}
.card .no{font-family:var(--display);color:var(--accent)}
.card .nm{font-size:14.5px}
.type{border-radius:0;font-family:var(--body);font-weight:400;padding:3px 6px 2px;border:2px solid rgba(0,0,0,.28);text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.star{border-radius:0;border:2px solid var(--line);background:var(--surface)}
.star[aria-pressed="true"]{background:var(--sun);border-color:var(--line);color:var(--accent)}
.badge{border-radius:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);border:2px solid var(--line)}
.empty{border:var(--px) dashed var(--line);border-radius:0;background:var(--surface)}
.detail{background:var(--surface);border-left:var(--px) solid var(--line);box-shadow:-6px 0 0 rgba(74,46,30,.25)}
.d-head{border-bottom:var(--px) solid var(--line);background:linear-gradient(var(--raise),var(--surface))}
.d-spr{border-radius:0;border:var(--px) solid var(--line);box-shadow:4px 4px 0 var(--line)}
.d-no{font-family:var(--display);color:var(--accent)}
.d-name{font-family:var(--display);font-size:26px;text-shadow:2px 2px 0 var(--sun)}
.close{border-radius:0;border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--line)}
.btn{border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--line)}
.btn[aria-pressed="true"],.shinytog[aria-pressed="true"]{background:var(--sun);border-color:var(--line);transform:translate(2px,2px);box-shadow:none}
.forms button{border:2px solid var(--line);background:var(--surface)}
.forms button[aria-pressed="true"],.formgrid button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.listmenu{border:var(--px) solid var(--line);border-radius:0;box-shadow:4px 4px 0 var(--line)}
.tabs{border-bottom:var(--px) solid var(--line);background:var(--raise);gap:0;padding:0}
.tabs button{font-family:var(--display);font-size:12px;border-right:2px solid var(--soft-line);border-bottom:0;padding:11px 12px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.kv{border:var(--px) solid var(--line);border-radius:0;background:var(--line);gap:2px}
.kv b{font-family:var(--display);color:var(--accent);font-size:10px}
.stat .track{height:10px;border-radius:0;border:2px solid var(--line);background:var(--surface)}
.stat .track i{border-radius:0}
.stat .v{font-family:var(--display)}
.abil span{border:2px solid var(--line);background:var(--surface)}
.abil span.h{border-style:dashed;background:var(--gold-soft)}
.spawn,.raid,.odds,.evo-mon,.formgrid button,.note{border:2px solid var(--line);border-radius:0;background:var(--surface);box-shadow:3px 3px 0 var(--soft-line)}
.note{border-left-width:6px;border-left-color:var(--gold)}
.fck{display:inline-block;font:600 10.5px/1.5 var(--mono);letter-spacing:.03em;padding:0 6px;border:2px solid var(--line);background:var(--gold-soft);color:var(--ink);white-space:nowrap;vertical-align:1px}
.fck.k-none{background:var(--sunk);color:var(--muted);border-color:var(--muted)}
.fck.k-mega,.fck.k-fusion{background:var(--accent-soft)}
.fck.k-battle{background:var(--sky)}
.fck.k-regional,.fck.k-fixed,.fck.k-gender,.fck.k-evo{background:var(--surface)}
.fcnote{margin-top:10px;font-size:13px;line-height:1.5}
.fcnote .fck{margin-right:6px}
.fclist{display:grid;gap:6px}
.fclist div{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:4px 10px;align-items:start;padding:8px 10px;border:2px solid var(--soft-line);background:var(--surface);font-size:13px;line-height:1.5}
.fclist div[aria-current="true"]{border-color:var(--line);box-shadow:3px 3px 0 var(--soft-line)}
.fclist b{font-size:13px}
.fclist .fck{margin-top:3px;justify-self:start}
@media (max-width:560px){.fclist div{grid-template-columns:1fr}}
.rar{border-radius:0;font-family:var(--display);border:2px solid currentColor}
.pill{border:2px solid var(--soft-line)}
details.bt summary{border:2px solid var(--line)}
details.bt[open] summary{background:var(--sun);color:var(--ink)}
.evo-cond{border-left:4px solid var(--accent)}
.evo-mon .spr,.shinycmp .spr{border-radius:0}
.odds b{font-family:var(--display);color:var(--accent)}
.tier i{color:var(--gold)}
.toast{border-radius:0;border:var(--px) solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:var(--body)}
.scrim{background:rgba(74,46,30,.35)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

/* ---------- phone layout ---------- */
@media (max-width:640px){
  body{font-size:15px}
  .bar-in{gap:8px;padding:8px 12px}
  .brand .t{display:none}
  .search input{padding:10px 10px 10px 34px;font-size:16px}
  .seg button{padding:7px 9px}
  .iconbtn{padding:8px 11px;font-size:16px}
  main{padding:12px}
  .summary{gap:8px}
  .summary h1{font-size:19px}
  .summary .sort{width:100%;justify-content:flex-end}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:8px 8px 10px}
  .card .nm{font-size:15px}
  .card .sub{display:block;font-size:12px}
  .star{width:34px;height:34px;top:12px;right:12px}
  .detail{top:calc(env(safe-area-inset-top,0px) + 54px);width:100%;border-left:0}
  .d-head{grid-template-columns:1fr;gap:12px;padding:14px 14px 16px}
  .d-spr{width:min(240px,70vw);margin:0 auto}
  .d-name{font-size:24px}
  .d-actions .btn{padding:9px 12px}
  .forms button{padding:7px 10px}
  .tabs button{padding:12px 11px;font-size:12px}
  .d-body{padding:14px 14px 80px;gap:18px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{grid-template-columns:62px 34px 1fr}
  .raid{grid-template-columns:1fr}
  .evo-row{grid-template-columns:1fr}
  .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .partners button{padding:6px 10px}
  aside.side{width:min(320px,88vw)}
  .coll button{padding:10px 10px}
  .chip{padding:5px 10px;font-size:13.5px}
}
@media (max-width:360px){.grid{gap:8px}.card .sub{display:none}}

const t=k=>{const v=S[LANG][k];return v==null?(S.en[k]??k):v;};
const L=p=>Array.isArray(p)?(LANG==='ko'?(p[1]||p[0]):p[0]):(p??'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

// ---------- data
let SPECIAL={}, DEX=null, META=null, BY={}, SPR={}, SHEETS=[], TH={map:{},sheets:[]}, LARGE_OK=true;
if(/claude\.ai|claudeusercontent/.test(location.hostname)){const hb=document.getElementById('homeBtn');if(hb)hb.hidden=true;}
const MOBILE=(()=>{try{return matchMedia('(max-width: 640px), (pointer: coarse)').matches;}catch(e){return false;}})();
const state={view:'all',q:'',types:new Set(),source:null,egg:'',gens:new Set(),more:new Set(),sort:'no',sel:null,form:'',shiny:false,tab:'info'};
const store={favs:[],lists:[]};

// ---------- korean initial-consonant search
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(s){let o='';for(const ch of s){const c=ch.charCodeAt(0)-0xAC00;o+=(c>=0&&c<11172)?CHO[Math.floor(c/588)]:ch;}return o;}
const isCho=s=>/^[ㄱ-ㅎ]+$/.test(s);
const norm=s=>String(s||'').toLowerCase().replace(/[\s\-_.'’:♀♂]/g,'');

function sheetStyle(sh,i,url){
  const cols=sh.cols, rows=sh.rows, x=i%cols, y=Math.floor(i/cols);
  return `background-image:${url};background-size:${cols*100}% ${rows*100}%;background-position:${cols>1?x/(cols-1)*100:0}% ${rows>1?y/(rows-1)*100:0}%`;
}
function thumbStyle(id){
  const e=TH.map[id]||TH.map[String(id).split('__')[0]];
  if(!e)return '';
  const sh=TH.sheets[e[0]];return sheetStyle(sh,e[1],'var(--ts'+e[0]+')');
}
function sprStyle(id,thumb){
  if(thumb||!LARGE_OK)return thumbStyle(id);
  const e=SPR[id];
  if(!e)return '';
  const sh=SHEETS[e[0]], cols=sh.cols, rows=sh.rows, i=e[1];
  const x=i%cols, y=Math.floor(i/cols);
  return `background-image:url('${sh.f}');background-size:${cols*100}% ${rows*100}%;background-position:${cols>1?x/(cols-1)*100:0}% ${rows>1?y/(rows-1)*100:0}%`;
}
function sprId(p,form,shiny){
  const base=p.id+(form?'__'+form:'');
  const cand=[base+(shiny?'__shiny':''),base,p.id+(shiny?'__shiny':''),p.id];
  for(const c of cand)if(SPR[c])return c;
  return p.id;
}
const spr=(p,form,shiny,cls,thumb)=>{const st=sprStyle(sprId(p,form,shiny),thumb);return `<div class="spr${cls?' '+cls:''}${st?'':' nospr'}"><i style="${st}"></i></div>`;};
const typeChip=ty=>`<span class="type" style="--tc:${TYPE_C[ty]||'#888'}">${esc(L(META.types[ty]))}</span>`;
const fcChip=fc=>fc?`<span class="fck k-${fc.k}">${esc(L((META.fcKinds||{})[fc.k]||[fc.k,fc.k]))}</span>`:'';
const nameOf=id=>{const p=BY[id];if(p)return L(p.n);const n=META.names[id];return n?L(n):id;};

// ---------- storage: per-user db doc, localStorage fallback
let db=null, uid=null, saveTimer=null, storeMode='local';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem('ssdex-store')||'null');if(j){store.favs=j.favs||[];store.lists=j.lists||[];}}catch(e){}}
function saveLocal(){try{localStorage.setItem('ssdex-store',JSON.stringify(store));}catch(e){}}
function persist(){
  saveLocal();
  if(!db||!uid)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await db.doc('data/users/'+uid+'/dex').set({favs:store.favs,lists:store.lists,v:1});}
    catch(e){if(e&&e.code==='invalid_argument'){db=null;storeMode='local';}}
  },600);
}
async function initStore(){
  loadLocal();
  if(!window.claude||!window.claude.use)return;
  try{
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u)return;
    const id=await u.id();
    if(!id)return;
    db=d; uid=id; storeMode='db';
    const snap=await db.doc('data/users/'+uid+'/dex').get();
    if(snap.exists){
      const j=snap.data()||{};
      store.favs=Array.isArray(j.favs)?j.favs.slice():[];
      store.lists=Array.isArray(j.lists)?j.lists.map(l=>({id:l.id,name:l.name,items:(l.items||[]).slice()})):[];
      saveLocal();
    }else if(store.favs.length||store.lists.length){persist();}
    renderSide();renderGrid();if(state.sel)renderDetail();
  }catch(e){db=null;storeMode='local';}
}
const isFav=id=>store.favs.includes(id);
function toggleFav(id){const i=store.favs.indexOf(id);if(i>=0)store.favs.splice(i,1);else store.favs.push(id);persist();}
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1600);}

// ---------- derived
function sources(p){
  const s=new Set();
  if(p.sp&&p.sp.length)s.add('wild');
  if(p.fish&&p.fish.length)s.add('fish');
  if(p.gacha&&p.gacha.length)s.add('gacha');
  if(SPECIAL[p.id])s.add('special');
  if(!s.size)s.add('evoOnly');
  return s;
}
function bst(p){return (p.s||[]).reduce((a,b)=>a+b,0);}
function searchKey(p){
  if(p._k)return p._k;
  const names=[p.n[0],p.n[1],p.id];
  (p.forms||[]).forEach(f=>{names.push(f.n[0],f.n[1]);});
  p._k={n:names.map(norm).join('|'),c:chosung(p.n[1]||'')+'|'+(p.forms||[]).map(f=>chosung(f.n[1]||'')).join('|'),no:String(p.no)};
  return p._k;
}
function matches(p){
  const q=state.q.trim();
  if(q){
    const k=searchKey(p), nq=norm(q);
    let ok=false;
    if(/^#?\d+$/.test(q)) ok=k.no===q.replace('#','').replace(/^0+/,'')||k.no.startsWith(q.replace('#','').replace(/^0+/,''));
    else if(isCho(q.replace(/\s/g,''))) ok=k.c.replace(/\s/g,'').includes(q.replace(/\s/g,''));
    else ok=k.n.includes(nq);
    if(!ok)return false;
  }
  if(state.types.size){for(const ty of state.types)if(!(p.t||[]).includes(ty)&&!(p.forms||[]).some(f=>(f.t||[]).includes(ty)))return false;}
  if(state.source){const s=sources(p);if(state.source==='noWild'){if(s.has('wild'))return false;}else if(!s.has(state.source))return false;}
  if(state.egg&&!(p.eg||[]).includes(state.egg))return false;
  if(state.gens.size&&!state.gens.has(String(p.gen)))return false;
  for(const m of state.more){
    if(m==='rideable'&&!p.ride)return false;
    if(m==='shoulder'&&!p.sh)return false;
    if(m==='hasForms'&&!(p.forms||[]).some(f=>!f.bo))return false;
    if(m==='mega'&&!(p.forms||[]).some(f=>/^mega/i.test(f.name)||f.name==='Primal'))return false;
    if(m==='gmax'&&!(p.forms||[]).some(f=>/gmax/i.test(f.name)))return false;
    if(m==='legendary'&&!(p.lab||[]).some(l=>['legendary','mythical','ultra_beast','paradox'].includes(l)))return false;
  }
  return true;
}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}return prev[n];}
function fuzzyHit(p,q){
  const thr=q.length<=4?1:2;
  return [p.n[0],p.n[1],p.id].concat((p.forms||[]).map(f=>f.n[0])).some(n=>{const k=norm(n);return lev(q,k)<=thr||lev(q,k.slice(0,q.length))<=thr-(q.length<=4?0:1)||lev(q,k.slice(0,q.length+1))<=thr-(q.length<=4?0:1);});
}
let FUZZY=false;
function viewList(){
  let arr=DEX;
  if(state.view==='starred')arr=store.favs.map(id=>BY[id]).filter(Boolean);
  else if(state.view.startsWith('list:')){const l=store.lists.find(x=>'list:'+x.id===state.view);arr=l?l.items.map(id=>BY[id]).filter(Boolean):[];}
  const base=arr;
  arr=base.filter(matches);
  FUZZY=false;
  const q=norm(state.q.trim());
  if(!arr.length&&q.length>=3&&!/^#?\d+$/.test(q)&&!isCho(q)){
    const saveQ=state.q;state.q='';
    arr=base.filter(p=>matches(p)&&fuzzyHit(p,q));
    state.q=saveQ;FUZZY=arr.length>0;
  }
  const byNo=(a,b)=>(a.no-b.no)||a.id.localeCompare(b.id);
  if(state.sort==='name')arr=arr.slice().sort((a,b)=>L(a.n).localeCompare(L(b.n),LANG));
  else if(state.sort==='bst')arr=arr.slice().sort((a,b)=>bst(b)-bst(a)||byNo(a,b));
  else if(state.view==='all'||state.sort==='no')arr=arr.slice().sort(byNo);
  return arr;
}

// ---------- chrome
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('q').placeholder=t('search');
  $('newListName').placeholder=t('newList');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  const so=$('sort');so.innerHTML=[['no','sortNo'],['name','sortName'],['bst','sortBst']].map(([v,k])=>`<option value="${v}"${state.sort===v?' selected':''}>${esc(t(k))}</option>`).join('');
  renderFilters();renderSide();renderGrid();if(state.sel)renderDetail();
}
function renderSide(){
  const items=[['all',t('all'),DEX.length],['starred','★ '+t('starred'),store.favs.length]].concat(store.lists.map(l=>['list:'+l.id,l.name,l.items.length]));
  $('coll').innerHTML=items.map(([v,n,c])=>`<button type="button" data-v="${esc(v)}" aria-current="${state.view===v}"><span>${esc(n)}</span><span class="count">${c}</span></button>`).join('');
}
function renderFilters(){
  $('fType').innerHTML=TYPES.map(ty=>`<button type="button" class="chip tchip" style="--tc:${TYPE_C[ty]}" data-t="${ty}" aria-pressed="${state.types.has(ty)}"><i></i>${esc(L(META.types[ty]))}</button>`).join('');
  $('fSource').innerHTML=['wild','fish','gacha','special','evoOnly','noWild'].map(s=>`<button type="button" class="chip" data-s="${s}" aria-pressed="${state.source===s}">${esc(t(s))}</button>`).join('');
  const eg=Object.keys(META.eggGroups);
  $('fEgg').innerHTML=`<option value="">${esc(t('anyEgg'))}</option>`+eg.map(g=>`<option value="${g}"${state.egg===g?' selected':''}>${esc(L(META.eggGroups[g]))}</option>`).join('');

  $('fGen').innerHTML=gens.map(g=>`<button type="button" class="chip" data-g="${g}" aria-pressed="${state.gens.has(g)}">${esc(g.replace('a',' (Legends)'))}</button>`).join('');
  $('fMore').innerHTML=['rideable','shoulder','hasForms','mega','gmax','legendary'].map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${state.more.has(m)}">${esc(t(m))}</button>`).join('');
}
const STAR_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
function card(p){
  const b=[];
  if((p.lab||[]).includes('legendary'))b.push('L');else if((p.lab||[]).includes('mythical'))b.push('M');else if((p.lab||[]).includes('ultra_beast'))b.push('UB');else if((p.lab||[]).includes('paradox'))b.push('P');
  const alt=LANG==='ko'?p.n[0]:'';
  return `<div class="card" role="button" tabindex="0" data-id="${p.id}" aria-selected="${state.sel===p.id}">
    ${b.length?`<div class="badges">${b.map(x=>`<span class="badge">${x}</span>`).join('')}</div>`:''}
    <button type="button" class="star" data-star="${p.id}" aria-pressed="${isFav(p.id)}" aria-label="${esc(t('star'))}">${STAR_SVG}</button>
    ${spr(p,'',false,'',MOBILE)}
    <div class="no">#${String(p.no).padStart(4,'0')}</div>
    <div class="nm">${esc(L(p.n))}</div>
    ${alt?`<div class="sub">${esc(alt)}</div>`:''}
    <div class="types">${(p.t||[]).map(typeChip).join('')}</div>
  </div>`;
}
function renderGrid(){
  const arr=viewList();
  let title=t('all');
  if(state.view==='starred')title='★ '+t('starred');
  else if(state.view.startsWith('list:')){const l=store.lists.find(x=>'list:'+x.id===state.view);title=l?l.name:t('all');}
  $('viewTitle').textContent=title;
  $('viewCount').textContent=arr.length+' '+t('results')+(FUZZY?' · '+t('fuzzy'):'');
  $('listTools').hidden=!state.view.startsWith('list:');
  $('grid').innerHTML=arr.map(card).join('');
  const em=$('empty');
  em.hidden=arr.length>0;
  em.textContent=state.view==='starred'&&!store.favs.length?t('noneStar'):(state.view.startsWith('list:')&&!state.q&&!state.types.size?t('noneList'):t('none'));
}

// ---------- detail helpers
function tagLabel(ref){
  const tg=META.tags[ref];
  if(tg)return L(tg.n);
  if(META.biomes[ref])return L(META.biomes[ref]);
  const s=ref.replace(/^#/,'').split(':').pop();
  const reg=s.match(/(alola|galar|hisui|paldea)/);
  if(reg)return (LANG==='ko'?REGION.ko[reg[1]]+' 지역 바이옴':REGION.en[reg[1]]+' region biomes');
  return s.split('/').pop().replace(/^is_/,'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function biomeChip(ref){
  const tg=META.tags[ref];
  if(tg){
    const names=tg.b.map(b=>L(META.biomes[b]||[b,b])).join(', ');
    return `<details class="bt"><summary>${esc(L(tg.n))} <span class="dim">· ${tg.b.length}</span></summary><div class="bl">${esc(names)}</div></details>`;
  }
  return `<span class="pill">${esc(tagLabel(ref))}</span>`;
}
function pretty(id){return String(id).replace(/^#/,'').split(':').pop().split('/').pop().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function timeName(v){return String(v).split(',').map(x=>TIME[LANG][x.trim()]||x).join(', ');}
function spawnCard(s,p){
  const x=s.x||{}, notes=[];
  if(x.timeRange)notes.push('🕒 '+timeName(x.timeRange));
  if(x.notTime)notes.push((LANG==='ko'?'제외 시간: ':'Not at ')+timeName(x.notTime));
  if(x.isThundering)notes.push(LANG==='ko'?'⛈ 뇌우 중':'⛈ Thunderstorm');
  else if(x.isRaining===true)notes.push(LANG==='ko'?'🌧 비 올 때':'🌧 Raining');
  else if(x.isRaining===false)notes.push(LANG==='ko'?'맑을 때':'Not raining');
  if(x.canSeeSky===true)notes.push(LANG==='ko'?'하늘이 보이는 곳':'Open sky');
  if(x.canSeeSky===false)notes.push(LANG==='ko'?'하늘이 안 보이는 곳 (동굴 등)':'Under cover (caves)');
  if(x.minY!=null||x.maxY!=null)notes.push('Y '+(x.minY??'…')+' ~ '+(x.maxY??'…'));
  if(x.maxSkyLight!=null&&x.maxSkyLight<15)notes.push((LANG==='ko'?'하늘 빛 ':'Sky light ')+(x.minSkyLight??0)+'–'+x.maxSkyLight);
  if(x.maxLight!=null)notes.push((LANG==='ko'?'밝기 ':'Light ≤ ')+x.maxLight+(LANG==='ko'?' 이하':''));
  if(x.minLight!=null)notes.push((LANG==='ko'?'밝기 ':'Light ≥ ')+x.minLight+(LANG==='ko'?' 이상':''));
  if(x.moonPhase!=null)notes.push('🌙 '+String(x.moonPhase).split(',').map(i=>MOON[LANG][+i]||i).join(', '));
  if(x.isSlimeChunk)notes.push(LANG==='ko'?'슬라임 청크':'Slime chunk');
  if(x.minLureLevel)notes.push((LANG==='ko'?'미끼 레벨 ':'Lure level ')+x.minLureLevel+'+');
  if(x.rodType)notes.push((LANG==='ko'?'낚싯대: ':'Rod: ')+pretty(x.rodType));
  if(x.bait)notes.push((LANG==='ko'?'미끼: ':'Bait: ')+pretty(x.bait));
  if(x.key_item)notes.push('🔑 '+(LANG==='ko'?'필요 아이템: ':'Key item: ')+L(x.key_item));
  if(x.lunarEvent)notes.push('🌕 '+pretty(x.lunarEvent));
  if(x.structures)notes.push('🏛 '+x.structures.map(pretty).join(' / '));
  if(x.notStructures)notes.push((LANG==='ko'?'제외: ':'Not in: ')+x.notStructures.map(pretty).join(', '));
  if(x.nearby&&!(x.presets||[]).length)notes.push((LANG==='ko'?'근처 블록: ':'Near: ')+x.nearby.map(pretty).join(' / '));
  if(x.dimensions)notes.push(x.dimensions.map(pretty).join(', '));
  (x.wm||[]).forEach(w=>{const c=w.c||{};let cond=c.timeRange?timeName(c.timeRange):(c.isRaining?(LANG==='ko'?'비':'rain'):(c.isThundering?(LANG==='ko'?'뇌우':'thunder'):(c.moonPhase!=null?MOON[LANG][+String(c.moonPhase).split(',')[0]]:'')));if(cond)notes.push('×'+w.x+' '+(LANG==='ko'?cond+'에 출현 증가':'more likely at '+cond));});
  const pres=(x.presets||[]).map(pr=>`<span class="pill">${esc((PRESET[LANG][pr])||pretty(pr))}</span>`).join('');
  const share=META.buckets[s.k];
  const formTag=s.fm&&p.forms?(p.forms.find(f=>f.slug===s.fm)):null;
  return `<div class="spawn">
    <div class="spawn-top">
      <span class="rar ${esc(s.k)}" title="${share}% ${esc(t('bucketShare'))}">${esc(s.k)}</span>
      <span class="pill">${esc(t('level'))} ${esc(s.l||'?')}</span>
      <span class="pill">${esc(S[LANG].ctx[s.c]||s.c||'')}</span>
      ${formTag?`<span class="pill" style="border-color:var(--accent)">${esc(L(formTag.n))}</span>`:''}
      ${pres}
    </div>
    ${s.b&&s.b.length?`<div class="biomes">${s.b.map(biomeChip).join('')}</div>`:''}
    ${s.nb&&s.nb.length?`<div class="notes"><span>${esc(t('except'))}: ${s.nb.map(r=>esc(tagLabel(r))).join(', ')}</span></div>`:''}
    ${notes.length?`<div class="notes">${notes.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}
  </div>`;
}
function poolForm(e,p){const fm=e.fm&&p.forms?p.forms.find(f=>f.slug===e.fm):null;if(fm)return L(fm.n);const v=(e.p||[]).join(' ');const m=v.match(/magikarp_jump=([\w-]+)/);return m?pretty(m[1].replace(/-/g,'_')):'';}
const K_W=()=>LANG==='ko'?'가중치':'Weight';

  </div>`;}).join('');
}
function reqText(q){
  const K=LANG==='ko', v=q.v;
  switch(q.t){
    case 'level':return K?`Lv.${v} 이상`:`Level ${v}+`;
    case 'friendship':return K?`친밀도 ${v} 이상`:`Friendship ${v}+`;
    case 'time_range':return K?`${timeName(v)}에`:`during ${timeName(v)}`;
    case 'held_item':return K?`${L(v)}을(를) 지닌 채`:`holding ${L(v)}`;
    case 'biome':return q.v?(K?`${tagLabel(q.v)}에서`:`in ${tagLabel(q.v)}`):(K?`${tagLabel(q.not)} 밖에서`:`outside ${tagLabel(q.not)}`);
    case 'properties':{const m=String(v).match(/gender=(male|female)/);if(m)return K?(m[1]==='male'?'수컷만':'암컷만'):(m[1]==='male'?'male only':'female only');return String(v);}
    case 'has_move':return K?`${L(v)}을(를) 배운 상태`:`knows ${L(v)}`;
    case 'has_move_type':return K?`${L(v)} 타입 기술을 배운 상태`:`knows a ${L(v)}-type move`;
    case 'structure':return q.v?(K?`${pretty(q.v)} 안에서`:`inside ${pretty(q.v)}`):(K?`${pretty(q.not)} 밖에서`:`outside ${pretty(q.not)}`);
    case 'property_range':return K?`${pretty(q.f)} ${v}`:`${pretty(q.f)} ${v}`;
    case 'party_member':return K?`파티에 ${nameOf(v)}${q.in===false?' 없음':' 있음'}`:`${nameOf(v)} ${q.in===false?'not ':''}in party`;
    case 'defeat':return K?`${nameOf(v)} ${q.n}마리 쓰러뜨리기${q.p?' ('+q.p.replace('held_item=','지닌 도구 ').replace('cobblemon:','')+')':''}`:`defeat ${q.n} ${nameOf(v)}${q.p?' ('+q.p.replace('held_item=','holding ').replace('cobblemon:','')+')':''}`;
    case 'blocks_traveled':return K?`${v}블록 이동`:`travel ${v} blocks`;
    case 'battle_critical_hits':return K?`한 배틀에서 급소 ${v}회`:`land ${v} critical hits in one battle`;
    case 'recoil':return K?`반동 데미지 ${v} 받기`:`take ${v} recoil damage`;
    case 'damage_taken':return K?`데미지 ${v} 이상 받기`:`take ${v}+ damage without fainting`;
    case 'use_move':return K?`${L(v)} ${q.n}회 사용`:`use ${L(v)} ${q.n} times`;
    case 'stat_compare':return K?`${STAT_N.ko[['hp','attack','defence','special_attack','special_defence','speed'].indexOf(v[0])]} > ${STAT_N.ko[['hp','attack','defence','special_attack','special_defence','speed'].indexOf(v[1])]}`:`${pretty(v[0])} > ${pretty(v[1])}`;
    case 'stat_equal':return K?'공격 = 방어':'Attack = Defense';
    case 'weather':return K?(v==='rain'?'비 올 때':v==='thunder'?'뇌우 중':'맑을 때'):(v==='rain'?'while raining':v==='thunder'?'during a thunderstorm':'clear weather');
    case 'moon_phase':return K?`${MOON.ko[['FULL_MOON','WANING_GIBBOUS','THIRD_QUARTER','WANING_CRESCENT','NEW_MOON','WAXING_CRESCENT','FIRST_QUARTER','WAXING_GIBBOUS'].indexOf(v)]||v}에`:`on a ${pretty(String(v).toLowerCase())}`;
    case 'advancement':return K?`발전과제: ${pretty(v)}`:`advancement: ${pretty(v)}`;
    default:return q.raw?JSON.stringify(q.raw):q.t;
  }
}
function evoText(e){
  const K=LANG==='ko', parts=[];
  if(e.m==='trade')parts.push(K?(e.with?`${nameOf(e.with)}와(과) 교환`:'통신교환'):(e.with?`trade for ${nameOf(e.with)}`:'trade'));
  if(e.m==='item_interact')parts.push(K?`${L(e.item)} 사용`:`use ${L(e.item)}`);
  (e.r||[]).forEach(q=>parts.push(reqText(q)));
  if(e.m==='level_up'&&!(e.r||[]).some(q=>q.t==='level'))parts.unshift(K?'레벨업':'level up');
  return parts.join(K?' · ':', ');
}
function familyRoot(id){let p=BY[id], guard=0;while(p&&p.pre&&BY[p.pre]&&guard++<6)p=BY[p.pre];return p?p.id:id;}
function evoTreeHTML(root,cur,form){
  const seen=new Set();
  function node(id,depth){
    const p=BY[id];if(!p||seen.has(id)||depth>5)return '';
    seen.add(id);
    let evs=(p.evo||[]).slice();
    (p.forms||[]).forEach(f=>(f.evo||[]).forEach(e=>evs.push(Object.assign({_form:f},e))));
    const kids=evs.filter(e=>BY[e.to]).map(e=>{
      const fl=e._form?`<small>${esc(L(e._form.n))}</small>`:'';
      return `<div class="evo-row" style="margin-left:${depth?14:0}px"><div class="evo-cond">${fl}${esc(evoText(e))}</div>${monBtn(e.to,cur,e.p)}</div>${node(e.to,depth+1)}`;
    }).join('');
    return kids;
  }
  const body=node(root,0);
  return `<div class="evo-tree">${monBtn(root,cur)}${body||''}</div>`;
}
function monBtn(id,cur,props){

    if(st){e.stopPropagation();toggleFav(st.dataset.star);st.setAttribute('aria-pressed',String(isFav(st.dataset.star)));renderSide();if(state.view==='starred')renderGrid();if(state.sel===st.dataset.star)renderDetail();return;}
    const c=e.target.closest('.card');if(c)openMon(c.dataset.id);
  });
  $('grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))openMon(e.target.dataset.id);});
  $('scrim').addEventListener('click',closeDetail);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sel)closeDetail();});
  $('detail').addEventListener('click',e=>{
    const b=e.target.closest('button,input');if(!b)return;
    const p=BY[state.sel];
    if(b.id==='closeD')return closeDetail();
    if(b.id==='dStar'){toggleFav(p.id);renderSide();renderDetail();const c=document.querySelector(`.card[data-id="${p.id}"] .star`);if(c)c.setAttribute('aria-pressed',String(isFav(p.id)));if(state.view==='starred')renderGrid();return;}
    if(b.id==='dShiny'){state.shiny=!state.shiny;renderDetail();return;}
    if(b.id==='dLists'){
      const m=$('listMenu');const open=m.hidden;m.hidden=!open;b.setAttribute('aria-expanded',String(open));
      if(open){m.className='listmenu';m.innerHTML=`<b style="font-size:12.5px">${esc(t('listsTitle'))}</b>`+(store.lists.length?store.lists.map(l=>`<label><input type="checkbox" data-list="${l.id}" ${l.items.includes(p.id)?'checked':''}> ${esc(l.name)} <span class="dim mono" style="margin-left:auto">${l.items.length}</span></label>`).join(''):`<span class="dim" style="font-size:12.5px">${esc(t('noLists'))}</span>`);}
      return;
    }
    if(b.dataset.list!=null&&b.type==='checkbox'){
      const l=store.lists.find(x=>x.id===b.dataset.list);if(!l)return;
      const i=l.items.indexOf(p.id);if(b.checked&&i<0)l.items.push(p.id);if(!b.checked&&i>=0)l.items.splice(i,1);
      persist();renderSide();if(state.view==='list:'+l.id)renderGrid();toast(t('saved'));return;
    }
    if(b.dataset.tab){state.tab=b.dataset.tab;renderDetail();return;}
    if(b.dataset.form!=null&&!b.dataset.open){state.form=b.dataset.form;renderDetail();return;}
    if(b.dataset.open){openMon(b.dataset.open,b.dataset.form||'');return;}
    if(b.dataset.eggfilter){state.view='all';state.egg=b.dataset.eggfilter;renderFilters();renderSide();renderGrid();if(window.innerWidth<=980)closeDetail();return;}
  });
  const tip=$('tip');
  const showTip=el=>{
    const id=el.dataset.abil, d=META.abil&&META.abil[id];
    if(!d){tip.hidden=true;return;}
    tip.innerHTML=`<b>${esc(el.firstChild.textContent)}</b>${esc(L(d))}`;
    tip.hidden=false;
    const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
    let x=Math.min(Math.max(8,r.left),window.innerWidth-tw-8), y=r.bottom+8;
    if(y+th>window.innerHeight-8)y=r.top-th-8;
    tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
  };
  const hideTip=()=>{tip.hidden=true;};
  $('detail').addEventListener('mouseover',e=>{const el=e.target.closest('[data-abil]');if(el)showTip(el);});
  $('detail').addEventListener('mouseout',e=>{const el=e.target.closest('[data-abil]');if(el&&!el.contains(e.relatedTarget))hideTip();});
  $('detail').addEventListener('focusin',e=>{const el=e.target.closest('[data-abil]');if(el)showTip(el);});
  $('detail').addEventListener('focusout',hideTip);
  $('detail').addEventListener('scroll',hideTip,{passive:true});
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&BY[h]&&h!==state.sel)openMon(h);});
}

// ---------- boot
(async function boot(){
  try{
    const inl=id=>{const el=document.getElementById(id);return el?JSON.parse(el.textContent):null;};
    let d=inl('dexdata'), s=inl('sprdata'); TH=inl('thumbdata')||TH;
    TH.sheets.forEach((sh,k)=>document.documentElement.style.setProperty('--ts'+k,'url("'+sh.d+'")'));
    if(!d)d=await fetch('data/pokedex.json').then(r=>r.json());
    if(!s)s=await fetch('data/sprites.json').then(r=>r.json()).catch(()=>({sheets:[],map:{}}));
    DEX=d.pokemon;META=d.meta;SPECIAL=META.special||{};DEX.forEach(p=>BY[p.id]=p);SPR=s.map||{};SHEETS=s.sheets||[];
  }catch(e){$('grid').innerHTML='<div class="empty">Could not load Pokédex data. ('+esc(e&&e.message||e)+')</div>';return;}
  bind();applyLang();
  if(SHEETS[0]){const im=new Image();im.onerror=()=>{LARGE_OK=false;renderGrid();if(state.sel)renderDetail();};im.src=SHEETS[0].f;}
  const h=location.hash.slice(1);if(h&&BY[h])openMon(h);
  initStore();
})();
})();
</script>
